# Publishes a BrasOS update on every push to main: runs the tests, then uploads the source tarball and the manifest that installed
# systems read (Settings > Updates, `brasos-update`; see tools/update-server/publish.ts and docs/guide/10-installing.md).
# One-time setup: add the four secrets below (the update bucket's S3 keys) under Settings > Secrets and variables > Actions.
name: Publish update

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-update # one publish at a time; a newer push waits rather than racing the manifest
  cancel-in-progress: false

permissions:
  contents: read # the job only reads the repository; the upload uses the bucket keys, not the GitHub token

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions are pinned to a commit, not a moving tag (the version is in the comment)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test # a broken build is not published
      - name: Publish
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          NOTES: ${{ github.event.head_commit.message }} # through the environment, never pasted into the script
        run: bun tools/update-server/publish.ts "$(printf '%s' "$NOTES" | head -n 1)"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 96" role="img" aria-label="BrasOS">
  <!-- A "B" from plain geometry, in the spirit of Brazilian concrete art and Niemeyer's Brasilia: a slim column and two solid
       curves set apart by one even gap (4), the upper a dome, the lower a bowl, like the two halves of the National Congress.
       One gradient (green to violet) runs through both curves, so they read as a single flow. The mark is centered in its tile. -->
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="80"><stop offset="0" stop-color="#5fd39a"/><stop offset="1" stop-color="#9b87f5"/></linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#9a9aa6"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b1f"/><stop offset="1" stop-color="#0c0c0d"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fd39a"/><stop offset="1" stop-color="#9b87f5"/></linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#tile)"/>
  <rect x="29" y="16" width="10" height="64" rx="5" fill="url(#slab)"/>
  <path d="M43 16h6a14 14 0 0 1 0 28h-6z" fill="url(#flow)"/>
  <path d="M43 48h8a16 16 0 0 1 0 32h-8z" fill="url(#flow)"/>
  <text x="116" y="66" font-family="system-ui, 'Segoe UI', sans-serif" font-size="56" letter-spacing="-1" fill="#ececee"><tspan font-weight="300">Bras</tspan><tspan font-weight="700" fill="url(#word)">OS</tspan></text>
</svg>
